name: asdfghjkl action

on:
  workflow_dispatch:

concurrency:
  group: ingestion-engine
  cancel-in-progress: false

jobs:
  run-engine:
    name: Execute Data Ingestion
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - run: |
          pip install -r requirements.txt
      - name: Run Unified Ingestion Engine
        env:
          V0: ${{ secrets.V0 }}
          V3: ${{ secrets.V3 }}
          V4: ${{ secrets.V4 }}
          gx: ${{ secrets.gx }}
          bp: ${{ secrets.bp }}
          gg: ${{ secrets.gg }}
          # Switches on/off por fuente (Settings → Variables). Vacío = encendido. Ver switches.py
          SCRAPE_ANH: ${{ vars.SCRAPE_ANH }}
          SCRAPE_GENEX: ${{ vars.SCRAPE_GENEX }}
          SCRAPE_BIOPETROL: ${{ vars.SCRAPE_BIOPETROL }}
          SCRAPE_GASGROUP: ${{ vars.SCRAPE_GASGROUP }}
          SCRAPE_YPFB: ${{ vars.SCRAPE_YPFB }}
          # SUR-79: via RPC (api.ingest_official_reports) por fuente. APAGADOS por defecto: solo true/on/1 los enciende.
          INGEST_RPC_GENEX: ${{ vars.INGEST_RPC_GENEX }}
          INGEST_RPC_BIOPETROL: ${{ vars.INGEST_RPC_BIOPETROL }}
          INGEST_RPC_GASGROUP: ${{ vars.INGEST_RPC_GASGROUP }}
          INGEST_RPC_ANH: ${{ vars.INGEST_RPC_ANH }}
          INGEST_BATCH_SIZE: ${{ vars.INGEST_BATCH_SIZE }}
          INGEST_DRY_RUN: ${{ vars.INGEST_DRY_RUN }}
        run: |
          python main.py
      - name: Run Proximity & Geofencing Immediately
        if: ${{ vars.RUN_PROXIMITY != 'false' }}
        env:
          V3: ${{ secrets.V3 }}
          V4: ${{ secrets.V4 }}
          SCRAPE_KYROS_GPS: ${{ vars.SCRAPE_KYROS_GPS }}
        run: |
          python verificar_proximidad_cisternas.py
      - name: Commit and push updated OSRM cache
        run: |
          git config user.name "surtibot"
          git config user.email "surtibot@surtiveo.com"
          git add osrm_routes_cache.json
          if ! git diff --staged --quiet; then
            git commit -m "update osrm routes cache [skip ci]"
            git pull --rebase origin main || git pull --rebase
            git push origin main
          fi
