name: asdfghjkl action

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: ingestion-engine
  cancel-in-progress: false

jobs:
  run-engine:
    name: Execute Data Ingestion
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - run: |
          pip install -r requirements.txt
      - name: Run Unified Ingestion Engine
        env:
          V0: ${{ secrets.V0 }}
          V3: ${{ secrets.V3 }}
          V4: ${{ secrets.V4 }}
          gx: ${{ secrets.gx }}
          bp: ${{ secrets.bp }}
          gg: ${{ secrets.gg }}
        run: |
          python main.py
      - name: Commit and push updated OSRM cache
        run: |
          git config user.name "surtibot"
          git config user.email "surtibot@surtiveo.com"
          git add osrm_routes_cache.json
          if ! git diff --staged --quiet; then
            git commit -m "update osrm routes cache [skip ci]"
            git pull --rebase origin main || git pull --rebase
            git push origin main
          fi
